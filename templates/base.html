<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}I'Mobile{% endblock %} | I'Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      ink: '#14221F', spruce: '#1E5B47', mist: '#F3F6F4', sun: '#F0B429', danger: '#B3261E', leaf: '#DCE9E1'
    } } } };
  </script>
  <style>
    body { font-family: 'DM Sans', system-ui, sans-serif; background: #F3F6F4; color: #14221F; }
    h1, h2, h3, .display { font-family: 'Bricolage Grotesque', 'DM Sans', sans-serif; letter-spacing: -0.01em; }
    .field { width: 100%; min-height: 46px; padding: .65rem .85rem; font-size: 1rem; background: #fff;
             border: 1.5px solid #C5D3CB; border-radius: 10px; }
    .field:focus { outline: 3px solid rgba(240,180,41,.6); border-color: #1E5B47; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 1.25rem;
           font-weight: 600; color: #fff; background: #1E5B47; border: 1.5px solid #1E5B47; border-radius: 10px; cursor: pointer; }
    .btn:hover { background: #174a39; }
    .btn:focus-visible, a:focus-visible, button:focus-visible { outline: 3px solid #F0B429; outline-offset: 2px; }
    .btn-ghost { color: #1E5B47; background: transparent; }
    .btn-ghost:hover { background: #DCE9E1; }
  </style>
</head>
<body class="min-h-screen">
  <header class="bg-white border-b border-leaf">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="{% url 'home' %}" class="display text-xl font-bold text-spruce">I'Mobile</a>
      {% if user.is_authenticated %}
      <nav class="flex items-center gap-1 text-sm font-medium" aria-label="Main">
        <a href="{% url 'dashboard' %}" class="hidden sm:block px-3 py-2 rounded-lg hover:bg-leaf {% if 'dashboard' in request.path %}bg-leaf{% endif %}">Dashboard</a>
        <a href="{% url 'profile' %}" class="hidden sm:block px-3 py-2 rounded-lg hover:bg-leaf {% if request.path == '/profile/' %}bg-leaf{% endif %}">Profile</a>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}
          <button type="submit" class="px-3 py-2 rounded-lg hover:bg-leaf font-medium">Log out</button>
        </form>
      </nav>
      {% endif %}
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 {% if user.is_authenticated %}pb-24 sm:pb-10{% endif %}">
    {% if messages %}
    <div class="mb-5 space-y-2" role="status">
      {% for message in messages %}
      <div class="px-4 py-3 rounded-lg text-sm font-medium border
        {% if message.tags == 'success' %}bg-green-50 border-green-300 text-green-900
        {% elif message.tags == 'error' %}bg-red-50 border-red-300 text-danger
        {% elif message.tags == 'warning' %}bg-amber-50 border-amber-300 text-amber-900
        {% else %}bg-white border-leaf text-ink{% endif %}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  {% if user.is_authenticated %}
  <nav class="sm:hidden fixed bottom-0 inset-x-0 bg-white border-t border-leaf grid grid-cols-2 text-sm font-semibold" aria-label="Mobile">
    <a href="{% url 'dashboard' %}" class="py-4 text-center {% if 'dashboard' in request.path %}text-spruce bg-leaf{% endif %}">Dashboard</a>
    <a href="{% url 'profile' %}" class="py-4 text-center {% if request.path == '/profile/' %}text-spruce bg-leaf{% endif %}">Profile</a>
  </nav>
  {% endif %}
</body>
</html>
