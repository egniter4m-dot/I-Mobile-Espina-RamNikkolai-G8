<div class="mb-4">
  <label for="{{ field.id_for_label }}" class="block text-sm font-medium mb-1">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<p class="mt-1 text-xs text-ink/60">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="mt-1 text-sm text-danger">{{ error }}</p>{% endfor %}
</div>
